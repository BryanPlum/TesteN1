{% extends "base.html" %}

{% block title %}Acesso{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card bg-secondary text-light shadow">
            <div class="card-body">

                <h4 class="mb-3">Acesso ao Sistema</h4>

                <form method="POST">
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <button class="btn btn-primary w-100">Enviar código</button>
                </form>

                <hr>

                <a href="{{ url_for('login') }}" class="btn btn-outline-light w-100">
                    Já tenho login
                </a>

            </div>
        </div>

    </div>
</div>

{% endblock %}
